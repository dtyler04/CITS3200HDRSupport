<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GUIDE{% endblock %}</title>

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Schuss Slab Pro font stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/SchussSlabPro/stylesheet.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- HTMX for dynamic content updates -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    {% block head %}{% endblock %}
</head>
<body class="loading">
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="bouncing-loader">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="loading-text">Loading...</div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="hdr-header d-flex align-items-center px-4" style="position: relative;">
            <h1 class="w-100 text-center m-0">{% block header %}GUIDE{% endblock %}</h1>
            {% block header_button %}{% endblock %}
        </div>

        <!-- Flash messages -->
        <div id="flash-container" class="container mt-3">
            {% include "admin/_flashes.html" %}
        </div>
        <!-- Page Content -->
        <div class="container mt-5">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Loading Screen Script -->
    <script>
        // Hide loading overlay when page is fully loaded
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.classList.add('loaded');
                document.body.classList.remove('loading');
                setTimeout(function() {
                    const loadingOverlay = document.getElementById('loading-overlay');
                    if (loadingOverlay) loadingOverlay.remove();
                }, 500);
            }, 200);
        });

        // Fallback: Hide loading after 10 seconds max
        setTimeout(function() {
            if (!document.body.classList.contains('loaded')) {
                document.body.classList.add('loaded');
                document.body.classList.remove('loading');
            }
        }, 10000);

        // Show loading again on page navigation
        document.addEventListener('beforeunload', function() {
            document.body.classList.add('loading');
            document.body.classList.remove('loaded');
        });
    </script>
</body>
</html>
